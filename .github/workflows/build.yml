name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build app, extension and bridge
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Assemble dist
        run: node tools/assemble-dist.mjs
      - name: Publish to the dist branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
